<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BreadBasket</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <header class="navbar">

        <div class="logo">
            <span>🥖</span> BreadBasket
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="signup-btn">Get Started</a>
        </div>

    </header>



    <main class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <div class="auth-icon">
                    🥖
                </div>

                <p class="section-label">JOIN BREADBASKET</p>

                <h1>Create an Account</h1>

                <p>
                    Join us in reducing food waste and helping communities.
                </p>

            </div>


            <form id="registerForm">

                
                <div class="form-group">

                    <label for="registerRole">
                        Register As
                    </label>

                    <select id="registerRole" name="registerRole">

                        <option value="">
                            Select your role
                        </option>

                        <option value="donor">
                            Food Donor
                        </option>

                        <option value="ngo">
                            NGO
                        </option>

                        <option value="volunteer">
                            Volunteer
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="name">
                        Full Name / Organization Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="registerEmail"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="registerPassword"
                        placeholder="Create a password"
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                    >

                </div>


                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="terms"
                        >

                        I agree to the Terms & Conditions

                    </label>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>



            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="copyright">

            <p>
                © 2026 BreadBasket. Share Food. Spread Hope.
            </p>

        </div>

    </footer>

    <script src="js/validation.js"></script>

</body>

</html>
